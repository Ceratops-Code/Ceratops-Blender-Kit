name: Validate

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate-repository:
    name: validate-repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
      - name: Install npm validation dependencies
        run: npm --prefix scripts ci
      - name: Validate and test through SDLC
        uses: Ceratops-Code/Ceratops-AI-Agents-Kit/skills/ceratops-repo-lifecycle/scripts@ffb3855080cbb00f104d303915d761320cf7b7e8
        with:
          repo-root: ${{ github.workspace }}
          evidence-file: ${{ runner.temp }}/repository-validation.log

      - name: Upload validation evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: ignore
          name: repository-validation-evidence
          path: ${{ runner.temp }}/repository-validation.log
