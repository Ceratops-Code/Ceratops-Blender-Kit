version: 5
kind: ceratops-sdlc
repository:
  capabilities:
    uv:
      executable: uv
  actions:
    bootstrap:
      requires:
        capabilities:
          - uv
      steps:
        - run:
            - uv
            - sync
            - --project
            - scripts
            - --locked
    pre-build-checks:
      check-groups:
        source:
          requires:
            capabilities:
              - uv
          steps:
            - run:
                - uv
                - run
                - --locked
                - scripts/validate-repository.py
        tests:
          requires:
            capabilities:
              - uv
          steps:
            - run:
                - uv
                - run
                - --locked
                - scripts/run-tests.py
deliverables:
  mcp-servers:
    ceratops-blender-mcp:
      root-dir: mcp-servers/ceratops_blender_mcp
      manifest: mcp-servers/ceratops_blender_mcp/mcp-server.json
      build-after: []
      actions:
        pre-build-checks:
          check-groups:
            source:
              requires:
                capabilities: []
              no-op: Repository validation and tests cover the MCP server source and manifest.
        install:
          requires:
            capabilities: []
          steps:
            - handoff:
                lifecycle: ceratops-mcp-server-lifecycle
                action: install
                inputs:
                  mcp-server: ceratops-blender-mcp
  skills:
    ceratops-blender-kit:
      root-dir: skills/ceratops-blender-kit
      build-after: []
      actions:
        pre-build-checks:
          check-groups:
            source:
              requires:
                capabilities: []
              steps:
                - handoff:
                    lifecycle: ceratops-skill-lifecycle
                    action: source-validate
                    inputs:
                      skill: ceratops-blender-kit
        install:
          requires:
            capabilities: []
          steps:
            - handoff:
                lifecycle: ceratops-skill-lifecycle
                action: deploy
                inputs:
                  skill: ceratops-blender-kit
